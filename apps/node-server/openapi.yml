openapi: 3.1.0
info:
  title: Hono Mono Starter API
  version: 1.0.0
components:
  schemas:
    Note:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
      required:
        - id
        - title
        - body
        - createdAt
    ApiError:
      type: object
      properties:
        error:
          type: string
          description: Error message
          examples:
            - Not found
      required:
        - error
    CreateNoteInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        body:
          type: string
      required:
        - title
        - body
    Conversation:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        repo:
          type: string
        branchName:
          type: string
        sandboxName:
          type: string
        provider:
          type: string
          enum:
            - vercel
            - e2b
        status:
          type: string
          enum:
            - active
            - sleeping
            - expired
        lastActiveAt:
          type: string
        queuedMessages:
          type: array
          items:
            $ref: "#/components/schemas/QueuedMessage"
        availableSkills:
          type: array
          items:
            $ref: "#/components/schemas/SkillSummary"
        createdAt:
          type: string
      required:
        - id
        - title
        - repo
        - branchName
        - sandboxName
        - provider
        - status
        - lastActiveAt
        - queuedMessages
        - availableSkills
        - createdAt
    QueuedMessage:
      type: object
      properties:
        id:
          type: string
        text:
          type: string
          minLength: 1
        userId:
          type: string
        createdAt:
          type: integer
      required:
        - id
        - text
        - userId
        - createdAt
    SkillSummary:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
      required:
        - name
        - description
    CreateConversationInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        provider:
          type: string
          enum:
            - vercel
            - e2b
    ConversationEventsList:
      type: object
      properties:
        frames:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/ChatChunkEnvelope"
              - $ref: "#/components/schemas/ChatMessageFrame"
              - $ref: "#/components/schemas/ChatQueueFrame"
      required:
        - frames
    ChatChunkEnvelope:
      type: object
      properties:
        seq:
          type: integer
        chunk: {}
    ChatMessageFrame:
      type: object
      properties:
        seq:
          type: integer
        message: {}
      required:
        - seq
    ChatQueueFrame:
      type: object
      properties:
        queue:
          type: array
          items:
            $ref: "#/components/schemas/QueuedMessage"
      required:
        - queue
    TurnTelemetry:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/TurnTelemetryEvent"
      required:
        - events
    TurnTelemetryEvent:
      type: object
      properties:
        eventType:
          type: string
        ts:
          type: number
        payloadJson:
          type: string
      required:
        - eventType
        - ts
        - payloadJson
    StartTurnAck:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
        mode:
          type: string
          enum:
            - started
            - steered
            - queued
      required:
        - ok
        - mode
    PostChatMessageInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
        intent:
          type: string
          enum:
            - queue
            - steer
      required:
        - text
    AbortTurnAck:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
        queue:
          type: array
          items:
            $ref: "#/components/schemas/QueuedMessage"
      required:
        - ok
        - queue
    ApprovalAck:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
      required:
        - ok
    PostApprovalInput:
      type: object
      properties:
        behavior:
          type: string
          enum:
            - allow
            - allow-session
            - deny
        message:
          type: string
      required:
        - behavior
    PostAnswerInput:
      type: object
      properties:
        answer:
          type: string
          minLength: 1
      required:
        - answer
  parameters: {}
paths:
  /api/notes:
    get:
      tags:
        - Notes
      summary: List the current user’s notes
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
        - Notes
      summary: Create a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations:
    post:
      tags:
        - Chat
      summary: Create a chat session (provisions a Vercel sandbox + a dedicated git
        branch)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Repo/sandbox configuration or provisioning error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      tags:
        - Chat
      summary: List the current user’s chat sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations/{id}:
    get:
      tags:
        - Chat
      summary: Get one chat session’s detail (including status)
      parameters:
        - schema:
            type: string
            examples: &a1
              - 3f1b2c4d-...
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations/{id}/events:
    get:
      tags:
        - Chat
      summary: Replay a session’s persisted agent events (reconnection/history)
      parameters:
        - schema:
            type: string
            examples: *a1
          required: true
          name: id
          in: path
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
          required: false
          name: after
          in: query
      responses:
        "200":
          description: Events, in seq order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationEventsList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations/{id}/turns/{turn}/telemetry:
    get:
      tags:
        - Chat
      summary: One turn’s telemetry events (model-call metrics, tool executions) for
        the stats detail panel — empty when telemetry is disabled or the turn
        predates it
      parameters:
        - schema:
            type: string
            examples:
              - 3f1b2c4d-...
          required: true
          name: id
          in: path
        - schema:
            type: integer
            minimum: 1
            examples:
              - 1
          required: true
          name: turn
          in: path
      responses:
        "200":
          description: Telemetry events for this turn, in write order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnTelemetry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations/{id}/messages:
    post:
      tags:
        - Chat
      summary: 'Start a turn, queue this message for the next one, or steer the
        in-progress turn (docs/tech/steer-and-queue.md §4.1): with no turn
        running this acquires the sandbox, builds the session and hands off to
        the in-process turn runner (mode "started"); with one running it either
        queues `text` onto the conversation’s 待发队列 (mode "queued", the default)
        or injects it into the running turn via `Session.steer()` (mode
        "steered", `intent: "steer"`). Either way, events arrive over `GET
        .../stream`, not this response'
      parameters:
        - schema:
            type: string
            examples: *a1
          required: true
          name: id
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostChatMessageInput"
      responses:
        "202":
          description: Accepted — see `mode` ("started" | "steered" | "queued");
            poll/stream `GET .../stream` for its events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartTurnAck"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Either the 待发队列 is full (docs/features/steer-and-queue.md §2.3 —
            nothing is ever silently dropped), or a turn was already in progress
            and could not be steered either (narrow race — the turn ended
            between the steer attempt and the fallback start)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Model/sandbox configuration or provisioning error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations/{id}/abort:
    post:
      tags:
        - Chat
      summary: '[停止](docs/terms.md)这个会话进行中的那一轮（docs/tech/turn-abort.md）：中止当前轮并清空[待发队列](docs/terms.md)。200
        只表示「停止已请求」——真正停下的时刻取决于 agent 当时在做什么（最坏情况是一条 bash 命令响应中断信号的时间），「已停止」这个结果走
        `GET .../stream` 上那条 `status: "interrupted"` 的 `message-metadata` chunk
        送达'
      parameters:
        - schema:
            type: string
            examples: *a1
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Stop requested — `queue` is the (now empty) 待发队列 snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbortTurnAck"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: No turn in progress on this conversation (nothing to stop) — also
            covers the narrow race where the turn finished on its own between
            the check and the abort. Nothing is changed in this case, the 待发队列
            included
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations/{id}/queue/{messageId}:
    delete:
      tags:
        - Chat
      summary: 从[待发队列](docs/terms.md)里删掉一条还没发出的消息——返回变更后的完整队列快照（调用方一次往返拿到权威状态，不必删完再查）
      parameters:
        - schema:
            type: string
            examples:
              - 3f1b2c4d-...
          required: true
          name: id
          in: path
        - schema:
            type: string
            examples:
              - 9c2e1f70-...
          required: true
          name: messageId
          in: path
      responses:
        "200":
          description: Queue after the removal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatQueueFrame"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found — either this conversation doesn’t exist (or isn’t the
            caller’s), or `messageId` isn’t in its queue anymore (already
            dequeued into a turn, already deleted, or never existed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations/{id}/queue:
    delete:
      tags:
        - Chat
      summary: 清空[待发队列](docs/terms.md)——已经出队起轮的消息不受影响（那已经是一条正常的用户消息了）
      parameters:
        - schema:
            type: string
            examples: *a1
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Queue after clearing (always empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatQueueFrame"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations/{id}/stream:
    get:
      tags:
        - Chat
      summary: "Resumable live tail of a session’s in-progress turn
        (docs/tech/chat-webapp.md §2.2b): replays persisted frames after
        `after`, then forwards the turn’s live chunks until it ends —
        reconnect-safe (page refresh/HMR/network blip never lose events)"
      parameters:
        - schema:
            type: string
            examples: *a1
          required: true
          name: id
          in: path
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
          required: false
          name: after
          in: query
      responses:
        "200":
          description: "SSE stream of `ChatReplayFrame`s (`{seq,message}` or
            `{seq?,chunk}`): replay, then live tail (closes once the turn ends,
            or immediately after replay if no turn is in progress). Live `chunk`
            frames omit `seq` when ephemeral (docs/tech/single-ledger.md §5 单-3
            — `text-delta`/`reasoning-delta`/`transient` data parts), never
            persisted and never replayed; every other frame always carries one"
          content:
            text/event-stream:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ChatChunkEnvelope"
                  - $ref: "#/components/schemas/ChatMessageFrame"
                  - $ref: "#/components/schemas/ChatQueueFrame"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations/{id}/approvals/{callId}:
    post:
      tags:
        - Chat
      summary: 批准或拒绝一个待处理的工具调用审批请求（docs/tech/chat-webapp.md
        §2.2c（审批链），docs/tech/single-ledger.md §6）：结果通过 `GET .../stream` 的
        `tool-approval-response` chunk 送达，本响应只是一个 ack
      parameters:
        - schema:
            type: string
            examples: &a2
              - 3f1b2c4d-...
          required: true
          name: id
          in: path
        - schema:
            type: string
            examples: &a3
              - call_1
          required: true
          name: callId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostApprovalInput"
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalAck"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found — either this session doesn’t exist (or isn’t the
            caller’s), or `callId` has no pending approval on it (already
            resolved, timed out, or never existed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations/{id}/questions/{callId}:
    post:
      tags:
        - Chat
      summary: 回答一个待处理的 ask-user 提问（docs/tech/chat-webapp.md §2.2c（审批链））：结果通过 `GET
        .../stream` 的 `tool-ask-user` 部件 output-available 状态送达，本响应只是一个 ack
      parameters:
        - schema:
            type: string
            examples: *a2
          required: true
          name: id
          in: path
        - schema:
            type: string
            examples: *a3
          required: true
          name: callId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostAnswerInput"
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalAck"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found — either this session doesn’t exist (or isn’t the
            caller’s), or `callId` has no pending question on it (already
            answered, timed out, or never existed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
webhooks: {}
