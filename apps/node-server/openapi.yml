openapi: 3.1.0
info:
  title: Hono Mono Starter API
  version: 1.0.0
components:
  schemas:
    Note:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
      required:
        - id
        - title
        - body
        - createdAt
    ApiError:
      type: object
      properties:
        error:
          type: string
          description: Error message
          examples:
            - Not found
      required:
        - error
    CreateNoteInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        body:
          type: string
      required:
        - title
        - body
    Conversation:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        repo:
          type: string
        branchName:
          type: string
        sandboxName:
          type: string
        provider:
          type: string
          enum:
            - vercel
            - e2b
        status:
          type: string
          enum:
            - active
            - sleeping
            - expired
        lastActiveAt:
          type: string
        createdAt:
          type: string
      required:
        - id
        - title
        - repo
        - branchName
        - sandboxName
        - provider
        - status
        - lastActiveAt
        - createdAt
    CreateConversationInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        provider:
          type: string
          enum:
            - vercel
            - e2b
    ConversationEventsList:
      type: object
      properties:
        frames:
          type: array
          items:
            anyOf:
              - $ref: "#/components/schemas/ChatChunkEnvelope"
              - $ref: "#/components/schemas/ChatMessageFrame"
      required:
        - frames
    ChatChunkEnvelope:
      type: object
      properties:
        seq:
          type: integer
        chunk: {}
    ChatMessageFrame:
      type: object
      properties:
        seq:
          type: integer
        message: {}
      required:
        - seq
    TurnTelemetry:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/TurnTelemetryEvent"
      required:
        - events
    TurnTelemetryEvent:
      type: object
      properties:
        eventType:
          type: string
        ts:
          type: number
        payloadJson:
          type: string
      required:
        - eventType
        - ts
        - payloadJson
    StartTurnAck:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
        mode:
          type: string
          enum:
            - started
            - steered
      required:
        - ok
        - mode
    PostChatMessageInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
      required:
        - text
    ApprovalAck:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
      required:
        - ok
    PostApprovalInput:
      type: object
      properties:
        behavior:
          type: string
          enum:
            - allow
            - allow-session
            - deny
        message:
          type: string
      required:
        - behavior
    PostAnswerInput:
      type: object
      properties:
        answer:
          type: string
          minLength: 1
      required:
        - answer
  parameters: {}
paths:
  /api/notes:
    get:
      tags:
        - Notes
      summary: List the current user’s notes
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
        - Notes
      summary: Create a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations:
    post:
      tags:
        - Chat
      summary: Create a chat session (provisions a Vercel sandbox + a dedicated git
        branch)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Repo/sandbox configuration or provisioning error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      tags:
        - Chat
      summary: List the current user’s chat sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations/{id}:
    get:
      tags:
        - Chat
      summary: Get one chat session’s detail (including status)
      parameters:
        - schema:
            type: string
            examples: &a1
              - 3f1b2c4d-...
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations/{id}/events:
    get:
      tags:
        - Chat
      summary: Replay a session’s persisted agent events (reconnection/history)
      parameters:
        - schema:
            type: string
            examples: *a1
          required: true
          name: id
          in: path
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
          required: false
          name: after
          in: query
      responses:
        "200":
          description: Events, in seq order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationEventsList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations/{id}/turns/{turn}/telemetry:
    get:
      tags:
        - Chat
      summary: One turn’s telemetry events (model-call metrics, tool executions) for
        the stats detail panel — empty when telemetry is disabled or the turn
        predates it
      parameters:
        - schema:
            type: string
            examples:
              - 3f1b2c4d-...
          required: true
          name: id
          in: path
        - schema:
            type: integer
            minimum: 1
            examples:
              - 1
          required: true
          name: turn
          in: path
      responses:
        "200":
          description: Telemetry events for this turn, in write order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TurnTelemetry"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations/{id}/messages:
    post:
      tags:
        - Chat
      summary: 'Start a turn for this message, or steer an in-progress one (STEER-3B):
        if the session has a turn running, `text` is injected into it via
        `Session.steer()` (mode "steered"); otherwise this acquires the sandbox,
        builds the session, and hands off to the in-process turn runner (mode
        "started"). Either way, events arrive over `GET .../stream`, not this
        response'
      parameters:
        - schema:
            type: string
            examples: *a1
          required: true
          name: id
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostChatMessageInput"
      responses:
        "202":
          description: Accepted — see `mode` ("started" | "steered"); poll/stream `GET
            .../stream` for its events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartTurnAck"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A turn is already in progress for this session and could not be
            steered either (narrow race — the turn ended between the steer
            attempt and the fallback start)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Model/sandbox configuration or provisioning error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations/{id}/stream:
    get:
      tags:
        - Chat
      summary: "Resumable live tail of a session’s in-progress turn
        (docs/tech/chat-webapp.md §2.2b): replays persisted frames after
        `after`, then forwards the turn’s live chunks until it ends —
        reconnect-safe (page refresh/HMR/network blip never lose events)"
      parameters:
        - schema:
            type: string
            examples: *a1
          required: true
          name: id
          in: path
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
          required: false
          name: after
          in: query
      responses:
        "200":
          description: "SSE stream of `ChatReplayFrame`s (`{seq,message}` or
            `{seq?,chunk}`): replay, then live tail (closes once the turn ends,
            or immediately after replay if no turn is in progress). Live `chunk`
            frames omit `seq` when ephemeral (docs/tech/single-ledger.md §5 单-3
            — `text-delta`/`reasoning-delta`/`transient` data parts), never
            persisted and never replayed; every other frame always carries one"
          content:
            text/event-stream:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/ChatChunkEnvelope"
                  - $ref: "#/components/schemas/ChatMessageFrame"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations/{id}/approvals/{callId}:
    post:
      tags:
        - Chat
      summary: 批准或拒绝一个待处理的工具调用审批请求（docs/tech/chat-webapp.md
        §2.2c（审批链），docs/tech/single-ledger.md §6）：结果通过 `GET .../stream` 的
        `tool-approval-response` chunk 送达，本响应只是一个 ack
      parameters:
        - schema:
            type: string
            examples: &a2
              - 3f1b2c4d-...
          required: true
          name: id
          in: path
        - schema:
            type: string
            examples: &a3
              - call_1
          required: true
          name: callId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostApprovalInput"
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalAck"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found — either this session doesn’t exist (or isn’t the
            caller’s), or `callId` has no pending approval on it (already
            resolved, timed out, or never existed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/conversations/{id}/questions/{callId}:
    post:
      tags:
        - Chat
      summary: 回答一个待处理的 ask-user 提问（docs/tech/chat-webapp.md §2.2c（审批链））：结果通过 `GET
        .../stream` 的 `tool-ask-user` 部件 output-available 状态送达，本响应只是一个 ack
      parameters:
        - schema:
            type: string
            examples: *a2
          required: true
          name: id
          in: path
        - schema:
            type: string
            examples: *a3
          required: true
          name: callId
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostAnswerInput"
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalAck"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found — either this session doesn’t exist (or isn’t the
            caller’s), or `callId` has no pending question on it (already
            answered, timed out, or never existed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
webhooks: {}
