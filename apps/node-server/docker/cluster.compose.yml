# 集群实验环境：nginx 统一入口 + 1–5 个 node-server 副本 + Postgres + Redis。
# 设计见 docs/host/node/tech/cluster-lab.md。
#
#   pnpm --filter @runko-chat/node-server cluster:up      # 起 3 个副本（默认），全部健康才返回
#   CLUSTER_REPLICAS=5 pnpm … cluster:up                  # 起 5 个
#   pnpm --filter @runko-chat/node-server cluster:down     # 连数据一起删掉
#
# 与[多副本验证环境](./compose.yml)的分工：那一套是三个写死的副本 + 故障注入（冻住、
# 断网、库卡顿），直播流靠转发；这一套副本数可变、多一个 Redis，直播流靠广播，
# 并且 WebSocket 与 SSE 两条通道都在。两套都留着。
name: runko-cluster

x-node-env: &node-env
  SERVER_PORT: "3900"
  DATABASE_URL: postgres://runko:runko@postgres:5432/runko
  # 配了它，直播流就广播给所有副本，不再转发给持有者（docs/host/node/tech/cluster-lab.md §5）。
  REDIS_URL: redis://redis:6379
  # 所有副本必须用同一个登录密钥与同一个对外地址，否则 cookie 在副本之间认不过。
  BETTER_AUTH_SECRET: cluster-auth-secret-not-for-production
  SERVER_URL: http://localhost:${CLUSTER_LB_PORT:-3940}
  # **登录只信任这一个来源**（better-auth 的 trustedOrigins，容器里是 production 档，
  # 会较真地校验 Origin 头）。缺省是 nginx 自己的地址，够测试用（它们手动带这个 Origin）。
  #
  # **要用浏览器连进来就得改它**：前端 dev server 跑在另一个端口，浏览器带的 Origin 是
  # 那个端口，对不上就一律 403、连注册都做不了。所以起集群时把它指到前端的地址：
  #   CLUSTER_CLIENT_URL=http://localhost:5273 pnpm cluster:up
  CLIENT_URL: ${CLUSTER_CLIENT_URL:-http://localhost:${CLUSTER_LB_PORT:-3940}}
  RUNKO_PEER_TOKEN: cluster-peer-token
  # [节点下线](../../../../docs/terms.md)：SIGTERM 到了之后节点[交权](../../../../docs/terms.md)——几百毫秒内把
  # 每份对话交给别的副本，还在跑的命令留在本节点上跑完再退出
  # （docs/logic/orchestration/tech/handover.md §5）。
  #
  # 时间预算：命令最长跑 90 秒（`RUNKO_TOOL_TIMEOUT_MS`），运维容器 `docker stop -t 120` 留出
  # 30 秒给写结果、关连接（§13「宽限期 ≥ 工具上限 + 30 秒」）。`SHUTDOWN_TIMEOUT_MS` 只管
  # 「等各轮交出去」这一步，交权本身几百毫秒就完成，它只防装配卡住。
  RUNKO_TOOL_TIMEOUT_MS: ${CLUSTER_TOOL_TIMEOUT_MS:-90000}
  SHUTDOWN_TIMEOUT_MS: ${CLUSTER_OFFLINE_GRACE_MS:-15000}
  # [发布序号](../../../../docs/terms.md)：交权只挑序号不比自己小的副本接手。一次「发布」就是用更大的
  # 序号起新副本（端到端测试里的滚动发布场景就这么做）。
  RUNKO_RELEASE_SEQ: ${CLUSTER_RELEASE_SEQ:-1}
  # 运维容器的地址与内部令牌：控制台 API 转发「下线/上线」请求要用（cluster-console.md §8）。
  # 令牌与下面 `ops` 服务的 `RUNKO_OPS_TOKEN` 必须是同一个值——风格同上面的
  # `RUNKO_PEER_TOKEN`，demo 项目写死够用。
  RUNKO_OPS_URL: http://ops:3950
  RUNKO_OPS_TOKEN: cluster-ops-token-not-for-production
  # 时间轴压扁：缺省值下（5 秒 / 60 秒）一个场景要等一分钟。
  # 接管阈值必须 ≥ 3 倍心跳，否则副本启动时就抛。
  RUNKO_HEARTBEAT_MS: ${CLUSTER_HEARTBEAT_MS:-1000}
  RUNKO_TAKEOVER_MS: ${CLUSTER_TAKEOVER_MS:-5000}
  RUNKO_FORWARD_TIMEOUT_MS: ${CLUSTER_FORWARD_TIMEOUT_MS:-2000}
  # 演示模型复述时每小段之间的间隔：调大 = 一轮跑得久，「这一轮还在跑」才是确定事实。
  CHAT_DEMO_DELAY_MS: ${CLUSTER_CHUNK_DELAY_MS:-400}
  CHAT_APPROVAL_MODE: ${CLUSTER_APPROVAL_MODE:-dangerous}
  CHAT_SUSPEND_MEMORY_WINDOW: ${CLUSTER_MEMORY_WINDOW_MS:-3000}
  LOG_LEVEL: ${CLUSTER_LOG_LEVEL:-info}

  # ─── 真模型（可选）──────────────────────────────────────────────────────
  # 这三个从**仓库根的 `.env`** 透进来（`cluster:up` 把那份文件喂给 compose 做变量替换）。
  # 那份文件在 `.gitignore` 里，所以 key 不进 git，compose 文件里也只有变量名。
  #
  # **按名单透，不整份灌进来**：root `.env` 里还有 SERVER_URL、DATABASE_PATH、
  # SANDBOX_PROVIDER 这些给单进程开发用的值，整份灌会把集群自己的配置顶掉。
  #
  # 两个都空 = 零配置那档，用[演示模型](../../../../docs/terms.md)，不联网不花钱。
  DEEPSEEK_API_BASE_URL: ${DEEPSEEK_API_BASE_URL:-}
  DEEPSEEK_API_TOKEN: ${DEEPSEEK_API_TOKEN:-}
  RUNKO_MODEL: ${RUNKO_MODEL:-}

  # ─── 云沙盒（可选）──────────────────────────────────────────────────────
  # 同样从仓库根 `.env` 按名单透。服务端按 key 在不在决定新建会话能选哪几档沙盒：
  # `E2B_API_KEY` 有值才出现 E2B，`VERCEL_TOKEN` 有值才出现 Vercel，全空只剩本地。
  # 云沙盒会把仓库 clone 进去，所以 `GITHUB_REPO` / `GITHUB_PAT` 也要一起透。
  #
  # **故意不透 `SANDBOX_PROVIDER`**：那是单进程开发的默认档，集群里让用户在弹窗里选。
  E2B_API_KEY: ${E2B_API_KEY:-}
  E2B_TEMPLATE: ${E2B_TEMPLATE:-}
  VERCEL_TOKEN: ${VERCEL_TOKEN:-}
  VERCEL_TEAM_ID: ${VERCEL_TEAM_ID:-}
  VERCEL_PROJECT_ID: ${VERCEL_PROJECT_ID:-}
  GITHUB_REPO: ${GITHUB_REPO:-}
  GITHUB_PAT: ${GITHUB_PAT:-}
  SANDBOX_IDLE_TIMEOUT_MS: ${SANDBOX_IDLE_TIMEOUT_MS:-}

services:
  postgres:
    # 不挂数据卷：实验环境每次都从空库开始，`down -v` 之后什么都不留。
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: runko
      POSTGRES_PASSWORD: runko
      POSTGRES_DB: runko
    networks: [cluster]
    ports: ["${CLUSTER_PG_PORT:-55443}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runko -d runko"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    # 直播的帧只在飞行途中存在（发布/订阅，不落盘），所以这里不要持久化也不要卷。
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [cluster]
    ports: ["${CLUSTER_REDIS_PORT:-56379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # 建表只跑一次，跑完即退。Postgres 上让多个副本各建一次会撞 pg_type 的唯一索引
  # （见 packages/persist-kysely/src/migrate.ts 末尾的注释）。
  migrate:
    image: runko-cluster/node-server:dev
    pull_policy: never
    init: true
    networks: [cluster]
    environment:
      <<: *node-env
    command: ["node", "dist/db/migrate-cli.js"]
    depends_on:
      postgres: { condition: service_healthy }

  # **一个服务，副本数由 `--scale node=N` 决定**（1–5）。
  #
  # 每个副本要有一个唯一、且别的副本找得到的地址——它会被原样写进租约的 holder，
  # 别人据此转发。写死服务名扩不动，所以**副本自己报自己的主机名**。`$$` 是写给 compose
  # 看的转义，容器里拿到的是 `$(hostname)`。
  #
  # **那个主机名是容器短 id（`d77ccde1e96c` 这种），不是容器名**——Docker 的内嵌 DNS 两个
  # 都解析得到，所以转发照常走得通；但测试里要认某个副本的 holder 时得 `docker inspect`
  # 问它的 Hostname，别照容器名拼。
  #
  # 代价：宿主机侧端口随机分配（五个容器不能都绑同一个固定端口）。要直连某个副本用
  # `pnpm … cluster:port`（`CLUSTER_INDEX=2` 指定第几个）。浏览器不受影响——它走 nginx。
  node:
    build:
      context: ../../..
      dockerfile: apps/node-server/docker/Dockerfile
    image: runko-cluster/node-server:dev
    init: true
    networks: [cluster]
    environment:
      <<: *node-env
    command:
      ["sh", "-c", "RUNKO_NODE_URL=http://$$(hostname):3900 exec node dist/index.js"]
    ports: ["3900"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3900/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 60
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # **一次「发布」的新版本副本**：同一个镜像，[发布序号](../../../../docs/terms.md)更大。只在 `release`
  # 这个 profile 下出现，平时不起。网络别名也叫 `node`，nginx 把流量一起分给它们：
  #
  #   CLUSTER_NEXT_REPLICAS=3 docker compose -f docker/cluster.compose.yml --profile release up -d --wait node-next
  #
  # 再逐个 `docker stop` 老副本，就是一次先启再停的滚动发布（docs/logic/orchestration/features/handover.md §5）。
  node-next:
    image: runko-cluster/node-server:dev
    init: true
    profiles: [release]
    networks:
      cluster:
        aliases: [node]
    environment:
      <<: *node-env
      RUNKO_RELEASE_SEQ: ${CLUSTER_NEXT_RELEASE_SEQ:-2}
    command:
      ["sh", "-c", "RUNKO_NODE_URL=http://$$(hostname):3900 exec node dist/index.js"]
    ports: ["3900"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3900/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 60
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  # [运维容器](../../../../docs/terms.md)：集群控制台经它操作 Docker——列节点、
  # `docker stop -t 120`（下线）、`docker start`（上线），见
  # docs/host/node/tech/cluster-console.md §7。同一个镜像、换一个入口，不需要
  # `x-node-env` 那一整套（数据库、模型、沙盒都不归它管，只要自己这几个变量）。
  ops:
    image: runko-cluster/node-server:dev
    pull_policy: never
    init: true
    networks: [cluster]
    environment:
      # 与上面 `x-node-env` 里的 `RUNKO_OPS_TOKEN` 必须是同一个值：节点拿它敲门，
      # 运维容器拿它验门。
      RUNKO_OPS_TOKEN: cluster-ops-token-not-for-production
      # 与下面 `node` 服务的服务名对应——运维容器靠「项目 + 服务」两个 label 把容器
      # 列表锁定在「这一套集群里的 node 副本」，见 §7.2 的 filters。
      # **项目名故意不配**：运维容器启动时问 Docker 自己属于哪个项目。端到端测试用
      # `-p runko-cluster-e2e` 另起一套，写死的话会去停开发者手上那套集群的节点。
      RUNKO_OPS_SERVICE: node
      # 强杀期限（秒）。缺省 120（≥ 工具上限 90 秒 + 30 秒）；端到端测试把它与上面的
      # `CLUSTER_TOOL_TIMEOUT_MS` 一起压扁，不然一个强杀场景要等两分钟。
      RUNKO_OPS_STOP_TIMEOUT_S: ${CLUSTER_OFFLINE_KILL_S:-120}
    command: ["node", "dist/ops/index.js"]
    # **必须 root**：镜像缺省 `USER node`，而宿主机的 `docker.sock` 只给 root（或 docker 组）
    # 读写，非 root 一连就 `EACCES`、运维容器起不来。不用「加进 docker 组」的写法：那个组的
    # gid 每台机器都不一样（Docker Desktop 上 socket 甚至是 root:root），写不死。
    # 这不额外放大权限——挂了 `docker.sock` 本来就等于整台机器的管理员（§7.4）。
    user: root
    # **不写 ports**：挂了 `docker.sock` 的容器等于整台机器的管理员（§7.4），只在
    # 集群内网里让节点够得着，绝不对宿主机开口子。
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3950/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 30

  lb:
    image: nginx:1.27-alpine
    volumes: ["./cluster.nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [cluster]
    ports: ["${CLUSTER_LB_PORT:-3940}:80"]
    depends_on:
      node: { condition: service_healthy }

# 一个网络就够：这一套不做「只切断某个副本和库」那类故障注入（那是多副本验证环境
# 的事，见 ./compose.yml），副本之间、副本与库/Redis 之间都在同一个网络里。
networks:
  cluster: {}
