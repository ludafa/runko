# 集群实验环境：nginx 统一入口 + 1–5 个 node-server 副本 + Postgres + Redis。
# 设计见 docs/host/node/tech/cluster-lab.md。
#
#   pnpm --filter @runko-chat/node-server cluster:up      # 起 3 个副本（默认），全部健康才返回
#   CLUSTER_REPLICAS=5 pnpm … cluster:up                  # 起 5 个
#   pnpm --filter @runko-chat/node-server cluster:down     # 连数据一起删掉
#
# 与[多副本验证环境](./compose.yml)的分工：那一套是三个写死的副本 + 故障注入（冻住、
# 断网、库卡顿），直播流靠转发；这一套副本数可变、多一个 Redis，直播流靠广播，
# 并且 WebSocket 与 SSE 两条通道都在。两套都留着。
name: runko-cluster

x-node-env: &node-env
  SERVER_PORT: "3900"
  DATABASE_URL: postgres://runko:runko@postgres:5432/runko
  # 配了它，直播流就广播给所有副本，不再转发给持有者（docs/host/node/tech/cluster-lab.md §5）。
  REDIS_URL: redis://redis:6379
  # 所有副本必须用同一个登录密钥与同一个对外地址，否则 cookie 在副本之间认不过。
  BETTER_AUTH_SECRET: cluster-auth-secret-not-for-production
  SERVER_URL: http://localhost:${CLUSTER_LB_PORT:-3940}
  # **登录只信任这一个来源**（better-auth 的 trustedOrigins，容器里是 production 档，
  # 会较真地校验 Origin 头）。缺省是 nginx 自己的地址，够测试用（它们手动带这个 Origin）。
  #
  # **要用浏览器连进来就得改它**：前端 dev server 跑在另一个端口，浏览器带的 Origin 是
  # 那个端口，对不上就一律 403、连注册都做不了。所以起集群时把它指到前端的地址：
  #   CLUSTER_CLIENT_URL=http://localhost:5273 pnpm cluster:up
  CLIENT_URL: ${CLUSTER_CLIENT_URL:-http://localhost:${CLUSTER_LB_PORT:-3940}}
  RUNKO_PEER_TOKEN: cluster-peer-token
  # 时间轴压扁：缺省值下（5 秒 / 60 秒）一个场景要等一分钟。
  # 接管阈值必须 ≥ 3 倍心跳，否则副本启动时就抛。
  RUNKO_HEARTBEAT_MS: ${CLUSTER_HEARTBEAT_MS:-1000}
  RUNKO_TAKEOVER_MS: ${CLUSTER_TAKEOVER_MS:-5000}
  RUNKO_FORWARD_TIMEOUT_MS: ${CLUSTER_FORWARD_TIMEOUT_MS:-2000}
  # 演示模型复述时每小段之间的间隔：调大 = 一轮跑得久，「这一轮还在跑」才是确定事实。
  CHAT_DEMO_DELAY_MS: ${CLUSTER_CHUNK_DELAY_MS:-400}
  CHAT_APPROVAL_MODE: ${CLUSTER_APPROVAL_MODE:-dangerous}
  CHAT_SUSPEND_MEMORY_WINDOW: ${CLUSTER_MEMORY_WINDOW_MS:-3000}
  LOG_LEVEL: ${CLUSTER_LOG_LEVEL:-info}

services:
  postgres:
    # 不挂数据卷：实验环境每次都从空库开始，`down -v` 之后什么都不留。
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: runko
      POSTGRES_PASSWORD: runko
      POSTGRES_DB: runko
    networks: [cluster]
    ports: ["${CLUSTER_PG_PORT:-55443}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runko -d runko"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    # 直播的帧只在飞行途中存在（发布/订阅，不落盘），所以这里不要持久化也不要卷。
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [cluster]
    ports: ["${CLUSTER_REDIS_PORT:-56379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # 建表只跑一次，跑完即退。Postgres 上让多个副本各建一次会撞 pg_type 的唯一索引
  # （见 packages/persist-kysely/src/migrate.ts 末尾的注释）。
  migrate:
    image: runko-cluster/node-server:dev
    pull_policy: never
    init: true
    networks: [cluster]
    environment:
      <<: *node-env
    command: ["node", "dist/db/migrate-cli.js"]
    depends_on:
      postgres: { condition: service_healthy }

  # **一个服务，副本数由 `--scale node=N` 决定**（1–5）。
  #
  # 每个副本要有一个唯一、且别的副本找得到的地址——它会被原样写进租约的 holder，
  # 别人据此转发。写死服务名扩不动，所以**副本自己报自己的主机名**。`$$` 是写给 compose
  # 看的转义，容器里拿到的是 `$(hostname)`。
  #
  # **那个主机名是容器短 id（`d77ccde1e96c` 这种），不是容器名**——Docker 的内嵌 DNS 两个
  # 都解析得到，所以转发照常走得通；但测试里要认某个副本的 holder 时得 `docker inspect`
  # 问它的 Hostname，别照容器名拼。
  #
  # 代价：宿主机侧端口随机分配（五个容器不能都绑同一个固定端口）。要直连某个副本用
  # `pnpm … cluster:port`（`CLUSTER_INDEX=2` 指定第几个）。浏览器不受影响——它走 nginx。
  node:
    build:
      context: ../../..
      dockerfile: apps/node-server/docker/Dockerfile
    image: runko-cluster/node-server:dev
    init: true
    networks: [cluster]
    environment:
      <<: *node-env
    command:
      ["sh", "-c", "RUNKO_NODE_URL=http://$$(hostname):3900 exec node dist/index.js"]
    ports: ["3900"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3900/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 2s
      timeout: 2s
      retries: 60
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  lb:
    image: nginx:1.27-alpine
    volumes: ["./cluster.nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [cluster]
    ports: ["${CLUSTER_LB_PORT:-3940}:80"]
    depends_on:
      node: { condition: service_healthy }

# 一个网络就够：这一套不做「只切断某个副本和库」那类故障注入（那是多副本验证环境
# 的事，见 ./compose.yml），副本之间、副本与库/Redis 之间都在同一个网络里。
networks:
  cluster: {}
