# 集群实验环境的统一入口：同一个端口吃 HTTP 与 WebSocket。
# 设计见 docs/host/node/tech/cluster-lab.md §4。
#
# **不需要会话粘性**：直播流靠 Redis 广播，连到哪个副本都一样；要动持有者进程内存的
# 那几条请求（发消息、停止、答审批）由应用自己转发。

# WebSocket 升级的标准写法：带 Upgrade 头的请求转成 `Connection: upgrade`，
# 普通 HTTP 请求（`$http_upgrade` 为空）转成 `Connection: close`。
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;

  # **每次请求都重新解析 `node`**，不在启动时定死。副本数是 `--scale` 调的，
  # 启动时解析一次的话，之后加起来的副本永远收不到流量。
  # 127.0.0.11 是 Docker 的内嵌 DNS；它给 `node` 返回全部副本的地址，轮流用。
  resolver 127.0.0.11 valid=2s ipv6=off;

  location / {
    # 目标写成变量才会走上面那个 resolver。代价是 nginx 不再自动补路径，
    # 要自己带上 `$request_uri`（它含查询串）。
    set $upstream http://node:3900;
    proxy_pass $upstream$request_uri;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # 把客户端原本的 Host 带过去：登录 cookie 与 better-auth 的来源校验都认它。
    proxy_set_header Host $host;

    # **SSE 与 WebSocket 都不能被缓冲**。开着的话 nginx 会攒满一块再往下吐，
    # 直播就退化成「一轮跑完才一次性出现」。
    proxy_buffering off;
    proxy_cache off;
    # 一条长连接可以安静很久（一轮在等人答审批时什么都不发）。
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    # [节点下线](../../../../docs/terms.md)期间，那个节点的闸门对浏览器请求一律回
    # 503（docs/host/node/tech/cluster-console.md §4.1）；这里让 nginx 见到 503 就
    # 换下一个节点重试，浏览器全程无感（§6）。
    #
    # `non_idempotent`：POST 也重试。前提是**本应用回 503 时，那个请求一定什么都没做**：
    # 闸门在处理任何业务之前就回了；转发时连不上持有者，请求根本没送到。转发时等持有者
    # 开口超时，请求可能已经被收下，那种情况回的是 504，不在下面的名单里，不会被重发。
    # `error`：节点彻底退出、`resolver` 缓存的地址还没刷新那几秒，连接会被拒，同样换一个。
    # 已知代价：节点在「收下 POST、还没回响应」时被强杀（SIGKILL / 崩溃），nginx 也会
    # 把它重发给别的节点。正常下线交权之后才退，不会碰上。
    proxy_next_upstream error timeout http_503 non_idempotent;
    # 滚动发布期间新老副本同时在线（最多 5 + 5 个），刚退出的几个的旧地址还在域名缓存里；
    # 次数太少的话几次都挑中刚退出的节点，客户端就拿到 504。
    proxy_next_upstream_tries 6;
    # **连接超时必须短**：节点刚退出的那几秒，Docker 内部域名的缓存（上面 `valid=2s`）里
    # 还有它的旧地址；挑中它时 TCP 连接不会立刻被拒，而是挂到连接超时——缺省 60 秒——
    # 才轮到 `proxy_next_upstream` 换节点。同一个容器网络里建连接是亚毫秒级，半秒绰绰有余；
    # 再长的话，[交权](../../../../docs/terms.md)之后浏览器的重连要白等这么久才落到活着的节点上。
    proxy_connect_timeout 500ms;
  }
}
