openapi: 3.1.0
info:
  title: Hono Mono Starter API
  version: 1.0.0
components:
  schemas:
    Note:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        body:
          type: string
        createdAt:
          type: string
      required:
        - id
        - title
        - body
        - createdAt
    ApiError:
      type: object
      properties:
        error:
          type: string
          description: Error message
          examples:
            - Not found
      required:
        - error
    CreateNoteInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        body:
          type: string
      required:
        - title
        - body
    ChatSession:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        repo:
          type: string
        branchName:
          type: string
        sandboxName:
          type: string
        status:
          type: string
          enum:
            - active
            - sleeping
            - expired
        lastActiveAt:
          type: string
        createdAt:
          type: string
      required:
        - id
        - title
        - repo
        - branchName
        - sandboxName
        - status
        - lastActiveAt
        - createdAt
    CreateChatSessionInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
    ChatEventsList:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/ChatEventEnvelope"
      required:
        - events
    ChatEventEnvelope:
      type: object
      properties:
        seq:
          type: integer
        event:
          anyOf:
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - session.started
                sessionId:
                  type: string
              required:
                - type
                - sessionId
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - turn.started
                turn:
                  type: number
              required:
                - type
                - turn
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - item.started
                item:
                  anyOf:
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - agent_message
                        text:
                          type: string
                      required:
                        - id
                        - type
                        - text
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - reasoning
                        text:
                          type: string
                      required:
                        - id
                        - type
                        - text
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - user_message
                        text:
                          type: string
                      required:
                        - id
                        - type
                        - text
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - tool_call
                        toolName:
                          type: string
                        input: {}
                        output:
                          anyOf:
                            - type: string
                            - {}
                            - type: "null"
                        status:
                          type: string
                          enum:
                            - in_progress
                            - completed
                            - failed
                            - denied
                      required:
                        - id
                        - type
                        - toolName
                        - status
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - file_change
                        changes:
                          type: array
                          items:
                            type: object
                            properties:
                              path:
                                type: string
                              kind:
                                type: string
                                enum:
                                  - add
                                  - update
                                  - delete
                            required:
                              - path
                              - kind
                      required:
                        - id
                        - type
                        - changes
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - plan_update
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              text:
                                type: string
                              completed:
                                type: boolean
                            required:
                              - text
                              - completed
                      required:
                        - id
                        - type
                        - items
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - error
                        message:
                          type: string
                      required:
                        - id
                        - type
                        - message
              required:
                - type
                - item
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - item.updated
                item:
                  anyOf:
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - agent_message
                        text:
                          type: string
                      required:
                        - id
                        - type
                        - text
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - reasoning
                        text:
                          type: string
                      required:
                        - id
                        - type
                        - text
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - user_message
                        text:
                          type: string
                      required:
                        - id
                        - type
                        - text
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - tool_call
                        toolName:
                          type: string
                        input: {}
                        output:
                          anyOf:
                            - type: string
                            - {}
                            - type: "null"
                        status:
                          type: string
                          enum:
                            - in_progress
                            - completed
                            - failed
                            - denied
                      required:
                        - id
                        - type
                        - toolName
                        - status
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - file_change
                        changes:
                          type: array
                          items:
                            type: object
                            properties:
                              path:
                                type: string
                              kind:
                                type: string
                                enum:
                                  - add
                                  - update
                                  - delete
                            required:
                              - path
                              - kind
                      required:
                        - id
                        - type
                        - changes
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - plan_update
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              text:
                                type: string
                              completed:
                                type: boolean
                            required:
                              - text
                              - completed
                      required:
                        - id
                        - type
                        - items
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - error
                        message:
                          type: string
                      required:
                        - id
                        - type
                        - message
              required:
                - type
                - item
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - item.completed
                item:
                  anyOf:
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - agent_message
                        text:
                          type: string
                      required:
                        - id
                        - type
                        - text
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - reasoning
                        text:
                          type: string
                      required:
                        - id
                        - type
                        - text
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - user_message
                        text:
                          type: string
                      required:
                        - id
                        - type
                        - text
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - tool_call
                        toolName:
                          type: string
                        input: {}
                        output:
                          anyOf:
                            - type: string
                            - {}
                            - type: "null"
                        status:
                          type: string
                          enum:
                            - in_progress
                            - completed
                            - failed
                            - denied
                      required:
                        - id
                        - type
                        - toolName
                        - status
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - file_change
                        changes:
                          type: array
                          items:
                            type: object
                            properties:
                              path:
                                type: string
                              kind:
                                type: string
                                enum:
                                  - add
                                  - update
                                  - delete
                            required:
                              - path
                              - kind
                      required:
                        - id
                        - type
                        - changes
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - plan_update
                        items:
                          type: array
                          items:
                            type: object
                            properties:
                              text:
                                type: string
                              completed:
                                type: boolean
                            required:
                              - text
                              - completed
                      required:
                        - id
                        - type
                        - items
                    - type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                          enum:
                            - error
                        message:
                          type: string
                      required:
                        - id
                        - type
                        - message
              required:
                - type
                - item
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - turn.completed
                usage:
                  $ref: "#/components/schemas/Usage"
              required:
                - type
                - usage
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - turn.failed
                error:
                  $ref: "#/components/schemas/NimboError"
              required:
                - type
                - error
            - $ref: "#/components/schemas/ChatUserMessage"
            - $ref: "#/components/schemas/ChatTurnResult"
            - $ref: "#/components/schemas/ChatTurnFailed"
      required:
        - seq
        - event
    Usage:
      type: object
      properties:
        inputTokens:
          type: number
        outputTokens:
          type: number
        totalTokens:
          type: number
        cachedInputTokens:
          type: number
    NimboError:
      type: object
      properties:
        code:
          type: string
          enum:
            - max_turns
            - context_overflow
            - provider_error
            - aborted
        message:
          type: string
      required:
        - code
        - message
    ChatUserMessage:
      type: object
      properties:
        type:
          type: string
          enum:
            - user.message
        text:
          type: string
      required:
        - type
        - text
    ChatTurnResult:
      type: object
      properties:
        type:
          type: string
          enum:
            - turn.result
        finalResponse:
          type: string
        usage:
          $ref: "#/components/schemas/Usage"
      required:
        - type
        - finalResponse
        - usage
    ChatTurnFailed:
      type: object
      properties:
        type:
          type: string
          enum:
            - turn.failed
        code:
          type: string
        message:
          type: string
      required:
        - type
        - code
        - message
    StartTurnAck:
      type: object
      properties:
        ok:
          type: boolean
          enum:
            - true
      required:
        - ok
    PostChatMessageInput:
      type: object
      properties:
        text:
          type: string
          minLength: 1
      required:
        - text
  parameters: {}
paths:
  /api/notes:
    get:
      tags:
        - Notes
      summary: List the current user’s notes
      responses:
        "200":
          description: Notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Note"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
        - Notes
      summary: Create a note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/sessions:
    post:
      tags:
        - Chat
      summary: Create a chat session (provisions a Vercel sandbox + a dedicated git
        branch)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatSessionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Repo/sandbox configuration or provisioning error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      tags:
        - Chat
      summary: List the current user’s chat sessions
      responses:
        "200":
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/sessions/{id}:
    get:
      tags:
        - Chat
      summary: Get one chat session’s detail (including status)
      parameters:
        - schema:
            type: string
            examples: &a1
              - 3f1b2c4d-...
          required: true
          name: id
          in: path
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatSession"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/sessions/{id}/events:
    get:
      tags:
        - Chat
      summary: Replay a session’s persisted agent events (reconnection/history)
      parameters:
        - schema:
            type: string
            examples: *a1
          required: true
          name: id
          in: path
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
          required: false
          name: after
          in: query
      responses:
        "200":
          description: Events, in seq order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatEventsList"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/sessions/{id}/messages:
    post:
      tags:
        - Chat
      summary: "Start a turn for this message (docs/08 §2.2b): acquires the sandbox,
        builds the session, and hands off to the in-process turn runner — the
        turn’s events arrive over `GET .../stream`, not this response"
      parameters:
        - schema:
            type: string
            examples: *a1
          required: true
          name: id
          in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostChatMessageInput"
      responses:
        "202":
          description: Turn started; poll/stream `GET .../stream` for its events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartTurnAck"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A turn is already in progress for this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Model/sandbox configuration or provisioning error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/chat/sessions/{id}/stream:
    get:
      tags:
        - Chat
      summary: "Resumable live tail of a session’s in-progress turn (docs/08 §2.2b):
        replays persisted events after `after`, then forwards the turn’s live
        events until it ends — reconnect-safe (page refresh/HMR/network blip
        never lose events)"
      parameters:
        - schema:
            type: string
            examples: *a1
          required: true
          name: id
          in: path
        - schema:
            type:
              - integer
              - "null"
            minimum: 0
          required: false
          name: after
          in: query
      responses:
        "200":
          description: "SSE stream of `{ seq, event }` frames: replay, then live tail
            (closes once the turn ends, or immediately after replay if no turn
            is in progress)"
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/ChatEventEnvelope"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
webhooks: {}
