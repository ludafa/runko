# 多副本验证环境的负载均衡：三个副本轮询。用来体验「请求随机落到某个副本上」。
# 做确定性验证请直连各副本的端口——副本死掉时这里会回 502，不适合当断言对象。
upstream replicas {
  server replica-a:3910;
  server replica-b:3910;
  server replica-c:3910;
}

server {
  listen 80;

  location / {
    proxy_pass http://replicas;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # **SSE 必须关缓冲**。开着的话 nginx 会攒满一块再往下吐，直播就退化成
    # 「一轮跑完才一次性出现」——跟 src/forward.ts 里「别把响应体读完再吐」是同一个坑。
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }
}
