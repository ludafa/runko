name: CI

# 占位：仅串起 install → build → typecheck → test 四步；矩阵/缓存优化/发布流程留待后续阶段。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 顺序为 build → typecheck → test（P4-2 施工回填）：@nimbo/core 的测试
      # devDep 了 @nimbo/virtual-fs（集成测试），跨包 `exports` 都指向各自的
      # `dist`——typecheck/test 若先于 build 跑，core 对 "@nimbo/virtual-fs"
      # 的类型/模块解析会先于 virtual-fs 产出 dist 而失败。build 先行使三步
      # 都能在干净 checkout 上稳定通过。
      - run: pnpm -r build

      - run: pnpm -r typecheck

      - run: pnpm -r test

      # 文档站的死链检查与 typecheck 已经被上面三步覆盖了——docs/ 是 workspace
      # 成员（@nimbo/docs），`pnpm -r build` 会构建它、构建时做全站死链检查，
      # `pnpm -r typecheck` 会查 .vitepress/ 下的配置。这里只补 front matter 体检：
      # 它的脚本名是 `check`，不在 `pnpm -r` 跑的那三个里，写错字段会让文档
      # 静默漏出侧栏，必须单列一步。
      - run: pnpm docs:check
