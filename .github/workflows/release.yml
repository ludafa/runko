name: Release

# 手动触发：Actions 页面 → Release → Run workflow。
# 不监听 push/tag——发版这件事永远由人点一下开始（决策回执 ②）。
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '演练：跑完整流程但不真的发布到 npm，也不推任何 commit/tag'
        type: boolean
        default: true

# 这三个权限缺一不可：
#   id-token: write —— **trusted publishing 的命根子**。GitHub 靠它在 workflow 运行时
#                      现场签发一张写明「我是 ludafa/runko 的 release.yml」的短命凭证
#                      （几分钟过期），npm 用 GitHub 的公钥验签后放行。没有它就退回到
#                      长期 token 那条路。
#   contents: write —— changesets 要把版本号与 CHANGELOG 的改动推回 main，并打 tag。
permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    # 三个真库：与 ci.yml 保持一致。**没有它们，persist-mysql / persist-mongo /
    # persist-postgres 在这里一条测试都不跑**（三个包都靠 RUNKO_TEST_*_URL 开关，
    # 没给就整档 skip）。发布不可逆，发布前的把关不能比日常 CI 还弱——
    # 首次演练就是漏了这段，三档全 skip 才发现。
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: runko
          POSTGRES_PASSWORD: runko
          POSTGRES_DB: runko
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U runko"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: runko
          MYSQL_DATABASE: runko
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -prunko"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mongo:
        image: mongo:8
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      RUNKO_TEST_POSTGRES_URL: postgres://runko:runko@127.0.0.1:5432/runko
      RUNKO_TEST_MYSQL_URL: mysql://root:runko@127.0.0.1:3306/runko
      RUNKO_TEST_MONGO_URL: mongodb://127.0.0.1:27017

    steps:
      - uses: actions/checkout@v7
        with:
          # changesets 要读历史才能判断哪些包有改动
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # trusted publishing 要求 npm CLI >= 11.5.1（Node 24 自带的未必够）。
      # 注意：**发布这步必须用 npm 而不是 pnpm**——截至 pnpm 11.11，`pnpm publish`
      # 完全不支持 OIDC/provenance（选项列表里没有这两个词），只有 npm 有。
      - name: 升级 npm 到支持 trusted publishing 的版本
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version)（trusted publishing 需 >= 11.5.1）"

      - run: pnpm install --frozen-lockfile

      # 发版前完整跑一遍 CI 的四步。发布不可逆，这里是最后一道闸。
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - run: pnpm docs:check

      # ---- 版本 ----

      - name: 消费 changeset，bump 版本与 CHANGELOG
        run: pnpm changeset version

      - name: 检查是否真有版本变更
        id: check
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "没有待发布的 changeset，后续步骤全部跳过。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "本次将发布："
            node -e '
              const {readdirSync,readFileSync} = require("fs");
              for (const d of readdirSync("packages")) {
                const p = JSON.parse(readFileSync(`packages/${d}/package.json`, "utf8"));
                if (!p.private) console.log(`  ${p.name}@${p.version}`);
              }
            '
          fi

      # ---- 发布 ----

      # **先把版本改动落成本地 commit，再去动 package.json 做协议替换。**
      # 顺序颠倒过就会出 0.1.1 那次的事故：收尾时用 `git checkout -- packages/`
      # 丢弃协议替换，把 changeset 刚写好的版本号一起抹了——CHANGELOG 推回去了、
      # 版本号没有，仓库停在 0.1.0 而 npm 上已是 0.1.1。下一次发版 changeset 会
      # 再 bump 出一个 registry 上已存在的号，于是一个包都发不出去。
      # 先 commit 之后，收尾那步的 checkout 恢复到的就是「已 bump」的 HEAD。
      - name: 先把版本改动提交到本地（此时还不 push）
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(release): 发布新版本"

      # npm 不认识 pnpm 的 `workspace:` 与 `catalog:` 两个私有协议，原样发上去装包的人
      # 会收到 EUNSUPPORTEDPROTOCOL。**0.1.1 就是这么发坏的**：当时只换了 workspace:，
      # 15 个包全带着 `zod: "catalog:"` 出了门，npm 一个都装不上。
      # （`pnpm publish` 两个协议都会换，但它不支持 provenance；`pnpm pack` 只换
      #  workspace: 不换 catalog:，实测过——所以只能自己换。）
      # 脚本换完会断言「一个私有协议都不剩」，有残留直接退出 1 把发布拦在门外。
      # 只改 CI 工作区，不提交。
      - name: 把 pnpm 私有协议换成真实版本号
        if: steps.check.outputs.changed == 'true'
        run: node scripts/resolve-publish-protocols.mjs


      # --provenance 生成溯源证明：npm 包页面会显示这个包来自哪个仓库、哪次 commit、
      # 哪条 workflow，别人可以验真。它依赖 package.json 的 repository 字段与
      # id-token 权限，两样都已就位。
      # （trusted publishing 下 npm 其实已默认带 provenance，这里显式写出以表明意图。）
      - name: 发布到 npm
        if: steps.check.outputs.changed == 'true' && inputs.dry_run == false
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            ver=$(node -p "require('./${dir}package.json').version")
            private=$(node -p "!!require('./${dir}package.json').private")
            if [ "$private" = "true" ]; then continue; fi
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "跳过 $name@$ver（registry 上已存在）"
              continue
            fi
            echo "发布 $name@$ver"
            ( cd "$dir" && npm publish --provenance --access public )
          done

      - name: 演练模式——只打包不发布
        if: steps.check.outputs.changed == 'true' && inputs.dry_run == true
        run: |
          set -euo pipefail
          for dir in packages/*/; do
            private=$(node -p "!!require('./${dir}package.json').private")
            if [ "$private" = "true" ]; then continue; fi
            ( cd "$dir" && npm publish --provenance --access public --dry-run )
          done
          echo "演练结束。把 dry_run 取消勾选再跑一次才会真的发布。"

      # 发布后立刻用 npm 真装一次。**0.1.1 的坏包正是靠这一步发现的**——当时它是我
      # 手动跑的：build/typecheck/test/docs 全绿、pnpm pack 验证也绿，唯独 `npm i`
      # 会炸（EUNSUPPORTEDPROTOCOL）。用 pnpm 验证发布产物有天然盲区：pnpm 认识自己
      # 的协议，装得上不代表 npm 装得上。所以这一步必须用 npm。
      # registry 索引有延迟（实测个别包两三分钟才可见），故带重试。
      - name: 发布后验证——用 npm 真装一次
        if: steps.check.outputs.changed == 'true' && inputs.dry_run == false
        run: |
          set -uo pipefail
          ver=$(node -p "require('./packages/sdk/package.json').version")
          work=$(mktemp -d)
          cd "$work" && npm init -y >/dev/null 2>&1
          for i in $(seq 1 12); do
            if npm i "@runko/sdk@$ver" --no-audit --no-fund >/dev/null 2>&1; then
              echo "✓ @runko/sdk@$ver 装上了，连带 @runko/core 实际版本：$(node -p "require('$work/node_modules/@runko/core/package.json').version")"
              exit 0
            fi
            echo "第 $i 次未成功（registry 索引可能还没同步），15s 后重试"
            sleep 15
          done
          echo "✗ @runko/sdk@$ver 发布后装不上——包可能是坏的，立刻排查（下面是真实报错）"
          npm i "@runko/sdk@$ver" --no-audit --no-fund 2>&1 | tail -20
          exit 1


      # ---- 收尾：把版本改动推回 main 并打 tag ----

      # 放在发布之后：npm 发成功了才留下版本记录。反过来的话，一旦发布失败，
      # main 上就躺着一个「已 bump 但 registry 上并不存在」的版本号。
      - name: 推回版本改动并打 tag
        if: steps.check.outputs.changed == 'true' && inputs.dry_run == false
        run: |
          set -euo pipefail
          # 丢弃协议替换对 package.json 的改动。版本 bump 早已在上面提交进 HEAD，
          # 所以这次 checkout 恢复出来的是「已 bump」的版本号，不会再被抹掉。
          git checkout -- packages/
          git status --short
          pnpm changeset tag
          git push --follow-tags origin HEAD:main
